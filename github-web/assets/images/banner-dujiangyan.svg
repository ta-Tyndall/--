<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">都江堰水墨长卷</title>
  <desc id="desc">岷江穿山而过，鱼嘴分水，远山、古堰与雾霭构成一幅淡墨山水。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e7"/>
      <stop offset=".52" stop-color="#e7e3d9"/>
      <stop offset="1" stop-color="#d8d8d1"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e9e3" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#a8b0ad" stop-opacity=".72"/>
      <stop offset="1" stop-color="#68726f" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#f7f3e9" stop-opacity=".92"/>
      <stop offset="1" stop-color="#d9d5c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="5" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    </filter>
    <path id="ridge" d="M-120 560C92 357 271 310 428 381c150 68 209-29 362-133 157-107 310 30 433 130 126 102 250 30 377-64 111-82 247-54 440 84v387H-120Z"/>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <circle cx="1490" cy="238" r="280" fill="url(#sun)"/>
  <g fill="#656a64" opacity=".2" filter="url(#wash)">
    <use href="#ridge" transform="translate(0 -120) scale(1.08)"/>
  </g>
  <g fill="#464c47" opacity=".34" filter="url(#wash)">
    <use href="#ridge" transform="translate(-80 -25) scale(.91 1.15)"/>
  </g>
  <g fill="#2d332f" opacity=".54" filter="url(#wash)">
    <use href="#ridge" transform="translate(-40 135) scale(.79 .83)"/>
  </g>
  <path d="M-100 670c270-107 469-67 672 50 174 100 343 140 520 54 214-104 429-60 958 172v250H-100Z" fill="url(#water)" opacity=".68"/>
  <g fill="none" stroke="#535e59" stroke-linecap="round">
