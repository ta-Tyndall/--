    <path d="M90 934c224-16 361 30 532 74 188 48 361 25 507-36" stroke-width="2" opacity=".2"/>
    <path d="M1470 737c-73 21-134 63-181 107-35 33-67 77-96 125M1556 742c-95 24-171 80-225 144" stroke-width="2" opacity=".18"/>
  </g>
  <g transform="translate(803 568)">
    <path d="M-138 47 10-52l162 99-21 32-141 12Z" fill="#4e544e" opacity=".82"/>
    <path d="M-162 67c104 17 233 16 348-2" fill="none" stroke="#222723" stroke-width="6" opacity=".72"/>
    <path d="M-57 13c12 49 13 79 0 107M-2-22c8 49 8 86-2 116M54-22c-2 50 2 86 10 113" fill="none" stroke="#f1eee5" stroke-width="3" opacity=".72"/>
    <path d="M-105 56c87 9 172 10 251 1" fill="none" stroke="#d9d5ca" stroke-width="2" opacity=".72"/>
  </g>
  <g transform="translate(1150 451)" fill="none" stroke="#262b27">
    <path d="M0 194V64M-72 77h144L44 47h-88Z" stroke-width="7"/>
