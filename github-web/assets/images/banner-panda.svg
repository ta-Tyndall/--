<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">熊猫基地水墨竹影</title>
  <desc id="desc">淡墨竹林间，一只大熊猫安坐于石上，竹叶飞白与留白构成静谧画面。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee5"/>
      <stop offset=".58" stop-color="#e4e2d9"/>
      <stop offset="1" stop-color="#d6d8d1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#faf7ef" stop-opacity=".95"/>
      <stop offset="1" stop-color="#faf7ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="bamboo" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fur" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="4" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
  </defs>
